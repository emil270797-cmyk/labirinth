<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Сырный путь</title>
    
    <!-- VK Bridge -->
    <script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
    
    <!-- Красивый шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            background: linear-gradient(135deg, #2c3e50, #4ca1af); /* Красивый фон */
            font-family: 'Nunito', sans-serif;
            margin: 0;
            padding: 20px 10px;
            min-height: 100vh;
            touch-action: none; 
        }

        /* Контейнер игры с эффектом стекла (Glassmorphism) */
        .game-container {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* Верхняя панель */
        .ui-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            width: 100%;
        }

        .energy-title {
            color: #fff;
            font-size: 18px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        /* Полоска энергии */
        .energy-container {
            width: 65%;
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            height: 24px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

        .energy-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #2ecc71, #27ae60);
            transition: width 0.3s ease, background 0.3s ease; /* Плавное убывание */
        }

        /* Игровое поле */
        canvas { 
            background: #fff8e7; /* Цвет светлого сыра для пола */
            border-radius: 12px; 
            box-shadow: inset 0 0 15px rgba(0,0,0,0.1);
        }

        /* Окно победы/поражения */
        .status-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(30, 30, 30, 0.95);
            padding: 30px 40px;
            border-radius: 20px;
            text-align: center;
            display: none; /* Скрыто по умолчанию */
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 2px solid #f39c12;
            width: 70%;
        }

        .status-overlay h1 { margin: 0 0 15px 0; font-size: 28px; }
        
        .status-overlay button {
            background: linear-gradient(to bottom, #f1c40f, #f39c12);
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            font-family: 'Nunito', sans-serif;
            border-radius: 10px;
            font-weight: bold;
            color: #fff;
            cursor: pointer;
            text-shadow: 1px 1px 1px rgba(0,0,0,0.3);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .status-overlay button:active { transform: translateY(2px); box-shadow: 0 2px 3px rgba(0,0,0,0.3); }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- HTML-интерфейс -->
        <div class="ui-header">
            <span class="energy-title">⚡ Энергия</span>
            <div class="energy-container">
                <div class="energy-bar" id="energyBar"></div>
            </div>
        </div>
        
        <div style="position: relative;">
            <canvas id="gameCanvas"></canvas>
            
            <!-- Всплывающее окно в конце игры -->
            <div class="status-overlay" id="statusOverlay">
                <h1 id="statusText"></h1>
                <button onclick="location.reload()">Играть снова</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
